# Azure Developer CLI configuration
# https://aka.ms/azure-dev/schema
name: gpt-realtime-2-vision-companion
metadata:
  template: gpt-realtime-2-vision-companion@0.2.0

services:
  backend:
    project: ./backend
    language: python
    host: containerapp
    docker:
      path: Dockerfile
      context: .

  frontend:
    project: ./frontend
    language: js
    host: staticwebapp
    dist: .

hooks:
  postprovision:
    posix:
      shell: sh
      run: ./scripts/inject-config.sh
      continueOnError: false
      interactive: true
    windows:
      shell: pwsh
      run: bash ./scripts/inject-config.sh
      continueOnError: false
      interactive: true

  postdeploy:
    posix:
      shell: sh
      run: |
        echo ""
        echo "🎉 Deploy complete!"
        echo "Frontend: $(azd env get-value FRONTEND_URL 2>/dev/null || echo '(see SWA portal)')"
        echo "Backend:  $(azd env get-value BACKEND_URL 2>/dev/null || echo '(see Container App portal)')"
        echo ""
        echo "Open the frontend URL and follow docs/demo-script.md."
      continueOnError: true
      interactive: true
