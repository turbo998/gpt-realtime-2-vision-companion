[project]
name = "gpt-realtime-2-vision-companion-backend"
version = "0.1.0"
description = "FastAPI WebSocket backend proxying audio + frames to Azure OpenAI gpt-realtime-2 for a blind & low-vision voice/vision companion."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "turbo998" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=13.1",
    "httpx>=0.27.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "azure-identity>=1.19.0",
    "openai>=1.54.0",
    "pillow>=10.4.0",
    "azure-monitor-opentelemetry>=1.6.4",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
